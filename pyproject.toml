[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-filipides"
version = "0.1.0"
description = "Garmin -> Supabase, so Claude can plan your training"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "garminconnect>=0.3.20",
    "pg8000>=1.31",
    "cryptography>=43",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
