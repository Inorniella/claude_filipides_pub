name: Sync Garmin

on:
  schedule:
    - cron: "37 6 * * *"        # every day ~06:37 UTC (07:37 CET in winter, 08:37 CEST in summer); adjust to your timezone
  workflow_dispatch:             # "Run workflow" button in the Actions tab
    inputs:
      days:
        description: "History of N days (empty = incremental since the last activity)"
        required: false
        default: ""
      wellness_days:
        description: "Days of wellness data to fetch (HRV, sleep, resting HR...)"
        required: false
        default: "7"

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ATHLETE_USER_ID: ${{ secrets.ATHLETE_USER_ID }}
          DAYS: ${{ inputs.days }}
          WELLNESS_DAYS: ${{ inputs.wellness_days || '7' }}
        run: |
          args=(--wellness-days "$WELLNESS_DAYS")
          if [ -n "$DAYS" ]; then args+=(--days "$DAYS"); fi
          python -m filipides sync "${args[@]}"
